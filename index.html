        "Trade Licensing",

    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is MESOB?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MESOB is Ethiopia's unified government services portal that provides citizens and businesses with online access to government services including business registration, trade licensing, passport applications, TIN registration, and more."
          }
        },
        {
          "@type": "Question",
          "name": "How do I register a business in Ethiopia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can register a business in Ethiopia through MESOB by selecting the Ministry of Trade service, filling out the application form, uploading required documents, and submitting your application online."
          }
        },
        {
          "@type": "Question",
          "name": "Can I apply for a passport online?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, you can start your passport application process through MESOB. Submit your application, upload required documents, and book an appointment at the Immigration and Citizenship Service office."
          }
        },
        {
          "@type": "Question",
          "name": "How do I get a TIN in Ethiopia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can register for a Tax Identification Number (TIN) through the Ministry of Revenues service on MESOB. Submit your application with the required identification documents to receive your TIN certificate."
          }
        },
        {
          "@type": "Question",
          "name": "What documents are needed for trade license renewal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For trade license renewal in Ethiopia, you typically need your previous trade license, TIN certificate, business registration certificate, and tax clearance certificate. Specific requirements vary by business type."
          }
        }
      ]
    }
    </script>
