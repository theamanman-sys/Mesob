<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/files/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MESOB - Ethiopian Government Services & Citizen Portal</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="MESOB - Ethiopian Government Services Portal" />
    <meta name="description" content="MESOB is Ethiopia's unified government services portal. Access citizen services, business registration, trade licensing, tax information, passport services, and more. Your gateway to Ethiopian e-government services." />
    <meta name="keywords" content="MESOB, Ethiopian government portal, Ethiopia e-government, citizen services, business registration, trade license, passport Ethiopia, tax Ethiopia, MESOB center, Ethiopian digital government" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="author" content="MESOB" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mesobcenter.netlify.app/" />
    <meta property="og:title" content="MESOB - Ethiopian Government Services Portal" />
    <meta property="og:description" content="Ethiopia's unified government services platform. Access citizen services, business registration, trade, tax, and more in one place." />
    <meta property="og:image" content="https://mesobcenter.netlify.app/files/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://mesobcenter.netlify.app/" />
    <meta property="twitter:title" content="MESOB - Ethiopian Government Services Portal" />
    <meta property="twitter:description" content="Ethiopia's unified government services platform. Access citizen services, business registration, trade, tax, and more." />
    <meta property="twitter:image" content="https://mesobcenter.netlify.app/files/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://mesobcenter.netlify.app/" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GovernmentOrganization",
      "name": "MESOB Center Services",
      "alternateName": "MESOB",
      "description": "Ethiopia's unified government services portal providing access to citizen services, business registration, trade licensing, and more.",
      "url": "https://mesobcenter.netlify.app/",
      "logo": "https://mesobcenter.netlify.app/files/logo.png",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "ET"
      },
      "sameAs": [
        "https://www.facebook.com/mesobgov",
        "https://twitter.com/mesobgov"
      ],
      "serviceType": [
        "Citizen Services",
        "Business Registration",
        "Trade Licensing",
        "Tax Services",
        "Passport Services",
        "Document Services"
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MESOB - Ethiopian Government Services",
      "url": "https://mesobcenter.netlify.app/",
      "description": "Access Ethiopian government services online - citizen portal, business services, and more.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://mesobcenter.netlify.app/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Font Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
