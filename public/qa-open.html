<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MESOB hero QA</title>
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        overflow: hidden;
        background: white;
      }
    </style>
  </head>
  <body>
    <iframe id="app" src="/"></iframe>
    <script>
      const frame = document.getElementById('app')
      frame.addEventListener('load', () => {
        window.setTimeout(() => {
          const appWindow = frame.contentWindow
          const hero = frame.contentDocument.querySelector('.mesob-hero-scroll')
          if (appWindow && hero) {
            appWindow.scrollTo(0, Math.round(hero.offsetHeight * 0.46))
          }
        }, 700)
      })
    </script>
  </body>
</html>
